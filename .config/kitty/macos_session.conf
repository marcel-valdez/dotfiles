# ==============================================================================
# Kitty Startup Session for macOS / Laptop (replaces XFCE4 session restore)
# ==============================================================================
# Launches local tmux in Tab 1 and the 5 standard Cloudtop (gcloud) gmosh
# sessions in Tabs 2-6: default, gtd, app_offboarding, misc_fixes, and learn.
#
# Usage:
#   kitty --session ~/.config/kitty/macos_session.conf
# ==============================================================================

new_tab local:default
cd ~
launch /opt/homebrew/bin/bash -l

new_tab gcloud:default
cd ~
launch --var jetski_client_tag=macos_default /opt/homebrew/bin/bash -lc '${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh --remote-sh "exec \"\${HOME}/.googlerc.d/bin/tmux-tagged-attach\" macos_default new-session -A -s default" gcloud'

new_tab gcloud:gtd
cd ~
launch --var jetski_client_tag=macos_gtd /opt/homebrew/bin/bash -lc '${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh --remote-sh "exec \"\${HOME}/.googlerc.d/bin/tmux-tagged-attach\" macos_gtd new-session -A -s gtd" gcloud'

new_tab gcloud:app_offboarding
cd ~
launch --var jetski_client_tag=macos_app_offboarding /opt/homebrew/bin/bash -lc '${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh --remote-sh "exec \"\${HOME}/.googlerc.d/bin/tmux-tagged-attach\" macos_app_offboarding new-session -A -s app_offboarding" gcloud'

new_tab gcloud:misc_fixes
cd ~
launch --var jetski_client_tag=macos_misc_fixes /opt/homebrew/bin/bash -lc '${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh --remote-sh "exec \"\${HOME}/.googlerc.d/bin/tmux-tagged-attach\" macos_misc_fixes new-session -A -s misc_fixes" gcloud'

new_tab gcloud:learn
cd ~
launch --var jetski_client_tag=macos_learn /opt/homebrew/bin/bash -lc '${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh --remote-sh "exec \"\${HOME}/.googlerc.d/bin/tmux-tagged-attach\" macos_learn new-session -A -s learn" gcloud'
