# ==============================================================================
# Kitty Startup Session for macOS / Laptop (replaces XFCE4 session restore)
# ==============================================================================
# Launches local tmux in Tab 1 and the 5 standard Cloudtop (gcloud) gmosh
# sessions in Tabs 2-6: default, gtd, app_offboarding, misc_fixes, and learn.
#
# Usage:
#   kitty --session ~/.config/kitty/macos_session.conf
# ==============================================================================

new_tab local:default
cd ~
launch /opt/homebrew/bin/bash -l

new_tab gcloud:default
cd ~
launch /opt/homebrew/bin/bash -lc "${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh gcloud 'tmux new-session -A -s default'"

new_tab gcloud:gtd
cd ~
launch /opt/homebrew/bin/bash -lc "${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh gcloud 'tmux new-session -A -s gtd'"

new_tab gcloud:app_offboarding
cd ~
launch /opt/homebrew/bin/bash -lc "${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh gcloud 'tmux new-session -A -s app_offboarding'"

new_tab gcloud:misc_fixes
cd ~
launch /opt/homebrew/bin/bash -lc "${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh gcloud 'tmux new-session -A -s misc_fixes'"

new_tab gcloud:learn
cd ~
launch /opt/homebrew/bin/bash -lc "${HOME}/scripts/retry_after_key.sh ${HOME}/scripts/ssh_keep_alive.sh --gmosh gcloud 'tmux new-session -A -s learn'"
