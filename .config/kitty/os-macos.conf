# macOS-only kitty settings. kitty.conf loads this file through
# `globinclude os-${KITTY_OS}.conf` (KITTY_OS is macos, linux or bsd), so it is
# skipped on every other OS.

# Start Homebrew's bash 5 instead of macOS's /bin/bash 3.2: ble.sh needs
# bash >= 4 for auto-complete. --login makes it read ~/.bash_profile.
shell /opt/homebrew/bin/bash --login
