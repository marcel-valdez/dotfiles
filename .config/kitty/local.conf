# local.conf: machine-local kitty settings, NOT shared between machines.
#
# kitty.conf loads this file last (`globinclude local.conf`), so anything here
# overrides the shared config. The repository only tracks this commented
# template (added with `git add -f`); put real per-machine settings (e.g. fonts
# tuned to this machine's monitors) below it and never commit them.
#
# Once per clone, hide local edits from git:
#   git -C ~ update-index --skip-worktree .config/kitty/local.conf
# (undo with --no-skip-worktree, e.g. to update this template).
#
# To pick fonts straight into this file:
#   kitten choose-fonts --config-file-name=local.conf
