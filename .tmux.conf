# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Plugins: prefix + Ctrl-s [save], prefix + Ctrl-r [restore]
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
# Note that the tmux-notify plugin checks process termination very naively, it
# checks that the pane contents end with: $, therefore if the process has not
# completed but happens to print out a single $, then it'll notify.
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'thewtex/tmux-mem-cpu-load'


# plugin configuration
set -g @prefix_highlight_show_copy_mode 'on'
set -g @resurrect-processes 'vi vim nvim man less more tail top htop irssi weechat mutt batcat cat fzf "~emacs .*->${HOME}/bin/emacs_resurrect.sh *" "batcat *" "cat *" "fzf *" "fzf-cs *"'
set -g @resurrect-capture-pane-contents 'on'
# Include additional information about the pane in the notification
set -g @tnotify-verbose 'on'
set -g @tnotify-verbose-title 'Task Completed'
set -g @tnotify-verbose-msg 'Session: #S > Window: #W[#I] > Pane: #P'
set -g @tnotify-custom-cmd '"${HOME}/bin/tmux-notify" "Task Completed" "$(tmux display-message -t \$${SESSION_ID}:@${WINDOW_ID}.${PANE_ID} -p "Session: #{session_name} \> Window: #{window_name}\[#{window_index}\] \> Pane: #{pane_index}")"; tmux switch-client -t %${PANE_ID}'
# Scan the processes every N seconds
set -g @tnotify-sleep-duration '3'

# modern colorized configuration
set -s default-terminal "xterm-256color"

# Panes:

# Keep your global layout indicators
set -g pane-border-lines 'heavy'
set -g pane-border-indicators 'both'
set -g pane-border-status 'top'

# Prefix + T prompts for a custom title and saves it to a pane-specific user option
bind-key T command-prompt -p "Pane title:" "set-option -p @custom_title '%%'"

# Prefix + t unsets the custom title, reverting the pane back to the default command name
unbind-key t
bind-key t set-option -pu @custom_title

# ==========================================
# 1. STORE TEMPLATES (Hides commas from the parser)
# ==========================================
# Normal Format: Shows @custom_title if set, otherwise falls back to pane_current_command
set -g @norm_fmt "#{?pane_active,#[fg=black]#[bg=#777777],#[fg=#555555]}#{pane_index}#[default] #{?pane_active,#[fg=blue],#[fg=#333366]}#{pane_current_path}#[default]: #{?pane_active,#[fg=green],#[fg=#555522]}#{?@custom_title,#{@custom_title},#{pane_current_command}}"
set -g @norm_style "#{?pane_in_mode,fg=#AAAAAA,#{synchronize-panes,fg=red,fg=green}}"

# Zoomed Format: Uses ## escaping to safely pass the same conditional into the shell loop
# The Zoomed Tab Bar formatting.
set -g @zoom_fmt " PANES: #(tmux list-panes -t '#{window_id}' -F '##{?pane_active,#[fg=black]#[bg=#777777],#[fg=#555555]} ##P:#[fg=blue]##{?@custom_title,##{@custom_title},##{pane_current_command}}#[default] ' | tr '\\n' ' ') "
set -g @zoom_style "fg=#555555,bg=black"

# ==========================================
# 2. EVALUATE DYNAMICALLY WITH #{E:...}
# ==========================================
# #{E:@variable} safely expands the format string *after* resolving the zoom check.
# This completely eliminates the nested comma parsing bug.
set -g pane-border-format "#{?window_zoomed_flag,#{E:@zoom_fmt},#{E:@norm_fmt}}"
set -g pane-active-border-style "#{?window_zoomed_flag,#{E:@zoom_style},#{E:@norm_style}}"
set -g pane-border-style "#{?window_zoomed_flag,fg=#555555,fg=#555555}"

# status bar design
set -g status-justify 'left'
set -g status-style 'fg=#888888,bg=#121210'
# the status bar is updated by an external script.
set -g status-interval 900

# messaging
set -g message-style 'fg=black,bg=white,bright'
set -g message-command-style 'fg=blue,bg=#121210'

# window mode (doesn't work?)
setw -g mode-style 'fg=#121212,bg=colour250'

# window status
setw -g window-status-bell-style 'bright'
setw -g window-status-activity-style 'bg=#8888c3,fg=#121210'

setw -g window-status-separator ''
setw -g window-status-current-style 'fg=#121212,bg=#ffffff,bright'
setw -g window-status-current-format \
  '#[fg=#121210]#I#[fg=#ffffff,bg=#121212]#[fg=#c6d406] #W#[fg=reverse,bg=reverse]#{p3:window_flags}'

setw -g window-status-style 'fg=#121210,bg=#a0a09d,none'
setw -g window-status-format \
  '#I#[reverse]#[bg=reverse,fg=#aaaaaa] #W#[reverse]#{p3:window_flags}'

# info on left
set -g status-left '#S'
set -g status-left-length 15
set -g status-left-style 'fg=#888888,bg=#121210,bright'

# info on right
# set -g status-style 'dim'
set -g status-position bottom
set -g status-right-style 'bright'
# We aren't allowed to change timezone on Cloudtop VMs, so we use this to show
# the US/Pacific time in the tmux status bar.
%if "#{==:#{host},marcelvaldez.c.googlers.com}"
set -g @server_alias "gcloud"
%elif "#{==:#{host},marcelvaldez.mtv.corp.google.com}"
set -g @server_alias "office"
%elif "#{==:#{host},marcelvaldez-glaptop}"
set -g @server_alias "laptop"
%elif "#{==:#{host},marcelvaldez-glaptop2}"
set -g @server_alias "laptop"
%else
set -g @server_alias "loaner"
%endif

# Run status daemon only on primary socket (default) and when enabled
if-shell -F \
  '#{&&:#{m:*/default,#{socket_path}},#{!=:#{@disable_status_daemon},1}}' \
  'run-shell -b "${HOME}/scripts/tmux_status_daemon.sh"'

set -g status-right-length 100

# Pop-up styles
set -g popup-border-lines 'rounded'

# Menu styles
set -g menu-border-lines 'rounded'

# TMUX behavior
set -g renumber-windows 'on'
set -g repeat-time 1000

# Terminal Integration
set -g allow-passthrough on
set -g focus-events on
set -g allow-rename on
# Add KITTY_LISTEN_ON to the list of variables to be updated on attach
set-option -g update-environment "KITTY_LISTEN_ON"
set-option -g update-environment "KITTY_PUBLIC_KEY"
set-option -g update-environment "KITTY_WINDOW_ID"
set-option -g update-environment "KITTY_PID"

# TODO: Determine if we want - and _ to be word separators, so far, experience says no.
set -g word-separators ' @"=()[]/'
set -ag word-separators "'"
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

unbind-key -n C-l
bind-key -n C-L refresh-client
bind-key C-l refresh-client

set -g history-limit 50000
set -g base-index 1
set -g focus-events on
setw -g mode-keys emacs

# Window Activity Configuration
setw -g monitor-activity on
setw -g visual-activity off

# Bell configuration
setw -g monitor-bell off
setw -g bell-action any
setw -g visual-bell on

bind-key -n M-R source-file "${HOME}/.tmux.conf" \; display-message "sourced ${HOME}/.tmux.conf"
bind-key M-r source-file "${HOME}/.tmux.conf" \; display-message "sourced ${HOME}/.tmux.conf"

# Navigation

## Pane Navigation

### Cycle through panes by index (keeps zoom state)
bind-key -r C-n select-pane -Z -t :.+
bind-key -r C-p select-pane -Z -t :.-

### Move between panes directionally using prefix using arrows (keeps zoom state)
bind-key Left  select-pane -Z -L
bind-key Down  select-pane -Z -D
bind-key Up    select-pane -Z -U
bind-key Right select-pane -Z -R

### Move between panes directionally with no prefix (keeps zoom state)
bind-key -n M-S-Up select-pane -Z -U
bind-key -n M-S-Down select-pane -Z -D
bind-key -n M-S-Left select-pane -Z -L
bind-key -n M-S-Right select-pane -Z -R
bind-key w display-panes

## Window navigation
bind-key -n "C-PPage" select-window -t :-
bind-key -n "C-NPage" select-window -t :+

## Session navigation
bind-key -n "M-PPage" switch-client -p
bind-key -n "M-NPage" switch-client -n

# Pane manipulation
bind-key - split-window -v -c "#{pane_current_path}"
bind-key M-- select-layout even-vertical
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key M-\\ select-layout even-horizontal

unbind-key M-Down
bind-key -r M-Down swap-pane -D
unbind-key M-Up
bind-key -r M-Up swap-pane -U

bind-key q confirm-before kill-pane
bind-key C-q confirm-before kill-pane

# Window manipulation
unbind-key M-Left
bind-key -r M-Left swap-window -d -t:-
unbind-key M-Right
bind-key -r M-Right swap-window -d -t:+
bind-key Q confirm-before kill-window
bind-key W command-prompt -I "#W" "rename-window '%%'"

# Pop-up Window
bind-key N if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
  } {
      display-popup -h 85% -w 85% -E "TERM=xterm-256color tmux new-session -A -s scratch"
  }

# Session management
bind-key S command-prompt -I "#S" "rename-session '%%'"
bind-key C-j display-popup -w 90% -h 90% -E "${HOME}/scripts/tmux-session-switcher.sh
"

# Put the tmux copy buffer into the clipboard
set -g set-clipboard on
set -s extended-keys on
set -wg xterm-keys on
set -sg escape-time 10
setw -g mouse on
# Ensure tmux recognizes the escape sequences from nested sessions
# Looks like extkeys breaks shift+tab in some cases, so it has been removed.
# removed margins:rectfill since those seem to be problematic
set -as terminal-features ",wezterm*:256:bpaste:ccolour:clipboard:cstyle:focus:mouse:overline:RGB:strikethrough:title:usstyle"
set -as terminal-features ",xterm-256color*:256:bpaste:ccolour:clipboard:cstyle:focus:mouse:extkeys:overline:RGB:strikethrough:title:usstyle"
set -as terminal-features ",xterm-kitty*:256:bpaste:ccolour:clipboard:cstyle:focus:mouse:extkeys:overline:RGB:strikethrough:title:usstyle"
# This ensures that even if features fail, TrueColor (Tc) is requested
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'

bind-key C-y paste-buffer
unbind-key -T copy-mode C-c
# Copy current tmux buffer to clipboards (system, remote, OSC 52).
bind-key C-b run-shell -b "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key M-b run-shell -b "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key M-w run-shell -b "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key C-w run-shell -b "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode C-c send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode C-w send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode-vi C-w send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
# Ctrl+; does not seem to work in tmux, there are possible solutions:
# a) bind prefix + ; to Ctrl+;
# unbind-key \;
# bind-key \; send-keys C-\\;
# b) bind Alt+; to Ctrl+;
# It is easier to use Ctrl+x Ctrl+[a->;] because I don't need to swap
# between pressing Ctrl and Alt
# bind-key -n M-\; send-keys C-\\;
# c) execute tmux send-keys C-\; directly from xbindkeys when Ctrl+; is pressed
# Jetski Message Fuzzy Search Popup for active pane
# Bound to both C-m and Enter to handle standard terminal CR and extended keycodes
bind-key C-m run-shell -b 'python3 ~/.googlerc.d/scripts/jetski_search/cli.py message-trigger "#{pane_tty}" "#{pane_id}" "#{client_name}"'
bind-key Enter run-shell -b 'python3 ~/.googlerc.d/scripts/jetski_search/cli.py message-trigger "#{pane_tty}" "#{pane_id}" "#{client_name}"'

if-shell "[[ -e ${HOME}/modules/tpm/tpm ]]" "run ${HOME}/modules/tpm/tpm"

# Re-assert copy-mode bindings post-TPM to prevent tmux-copycat overrides
bind-key -T copy-mode C-w send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"
bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "${HOME}/.googlerc.d/scripts/async_clipboard_copy.sh --notify-tmux"

